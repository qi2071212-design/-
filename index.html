<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Oscilloscope Animation</title>
<style>
  body {
    background: white;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ======== 修正された Excel 波形データ =========
const waveform = [
  50,50,65,51,58,43,61,52,54,40,58,50,56,43,56,42,56,43,57,42,
  57,42,57,50,52,50,59,43,40,56,50,40,62,52,60,46,58,59,43,52,
  35,37,36,38,35,38,35,37,56,45,46,46,65,40,68,41,70,43,68,41,
  69,40,70,40,70,40,71,39,56,46,60,45,63,43,99,3,3,3,3,3,3,3,
  3,3,3,3,5,7,8,60,43,70,40,73,39,75,32,78,34,75,32,78,30,80,
  32,80,32,80,30,80,30
];

// ======== 基本設定 =========
const DURATION = 92 * 1000; // 92秒
const totalPoints = waveform.length;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let startTime = null;
let lastTimestamp = null;
let finished = false;

// ★の軌跡（紙が流れているように左へ流す）
let trail = [];

// Y座標変換
function getY(value) {
  const centerY = canvas.height / 2;
  const scale = canvas.height * 0.01;
  return centerY - (value - 50) * scale;
}

function renderFrame(progress, dt) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const maxIndex = totalPoints - 1;

  // ★の滑らかなインデックス
  let floatIndex = progress * maxIndex;
  if (floatIndex < 0) floatIndex = 0;
  if (floatIndex > maxIndex) floatIndex = maxIndex;

  const i0 = Math.floor(floatIndex);
  const i1 = Math.min(i0 + 1, maxIndex);
  const frac = floatIndex - i0;

  // 補間して滑らかに
  const v0 = waveform[i0];
  const v1 = waveform[i1];
  const vInterp = v0 * (1 - frac) + v1 * frac;

  // ★の位置（中央固定）
  const starX = canvas.width / 2;
  const starY = getY(vInterp);

  // ======== 軌跡を左へ流す（速度を BPM43 相当に遅くした） ========
  const scrollSpeed = canvas.width / 12;  // ← ここを遅くした（元は /4）
  const dx = scrollSpeed * (dt / 1000);

  // 既存の軌跡を左へ移動
  for (let p of trail) {
    p.x -= dx;
  }

  // 画面外に出た点を削除
  trail = trail.filter(p => p.x > -50);

  // 新しい点を追加（現在の★の位置）
  trail.push({ x: starX, y: starY });

  // ======== 軌跡を折れ線グラフとして描画 ========
  if (trail.length > 1) {
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);
    for (let i = 1; i < trail.length; i++) {
      ctx.lineTo(trail[i].x, trail[i].y);
    }
    ctx.stroke();
  }

  // ======== ★の描画（中央固定） ========
  ctx.fillStyle = "#000";
  ctx.font = "40px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("★", starX, starY);
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  if (!lastTimestamp) lastTimestamp = timestamp;

  const elapsed = timestamp - startTime;
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  if (elapsed >= DURATION) {
    if (!finished) {
      finished = true;
      renderFrame(1, dt);
    }
    return;
  }

  const progress = elapsed / DURATION;
  renderFrame(progress, dt);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

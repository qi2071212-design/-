<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Oscilloscope Animation</title>
<style>
  body {
    background: white;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ======== Excel 波形データ =========
const waveform = [
  50,59,50,43,65,40,51,56,58,50,
  43,40,61,62,52,52,54,60,40,46,
  58,58,50,59,56,43,43,52,56,35,
  42,37,56,36,43,38,57,35,42,38,
  57,35,42,37,57,56,50,45,52,46,
  50,46,65,40,68,41,70,43,68,41,
  69,40,70,40,70,40,71,39,56,46,
  60,45,63,43,99,3,3,3,3,3,
  3,3,3,3,3,3,5,7,8,60,
  43,70,40,73,39,75,32,78,34,75,
  32,78,30,80,32,80,32,80,30,80,
  30
];

// ======== 基本設定 =========
const DURATION = 92 * 1000; // 92秒
const totalPoints = waveform.length;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let startTime = null;
let finished = false;

// Y座標変換
function getY(value) {
  const centerY = canvas.height / 2;
  const scale = canvas.height * 0.01;
  return centerY - (value - 50) * scale;
}

function renderFrame(progress) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const maxIndex = totalPoints - 1;

  // ★の滑らかなインデックス
  let floatIndex = progress * maxIndex;
  if (floatIndex < 0) floatIndex = 0;
  if (floatIndex > maxIndex) floatIndex = maxIndex;

  const i0 = Math.floor(floatIndex);
  const i1 = Math.min(i0 + 1, maxIndex);
  const frac = floatIndex - i0;

  // 補間して滑らかに
  const v0 = waveform[i0];
  const v1 = waveform[i1];
  const vInterp = v0 * (1 - frac) + v1 * frac;

  // ★の位置
  const starX = canvas.width / 2;
  const starY = getY(vInterp);

  // ======== 背景の流れる折れ線グラフ ========
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.beginPath();

  for (let i = 0; i < totalPoints; i++) {
    // 波形を左へ流す
    const x = ((i - floatIndex) * (canvas.width / totalPoints)) + starX;

    const y = getY(waveform[i]);

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();

  // ======== ★の描画（中央固定） ========
  ctx.fillStyle = "#000";
  ctx.font = "40px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("★", starX, starY);
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;

  if (elapsed >= DURATION) {
    if (!finished) {
      finished = true;
      renderFrame(1);
    }
    return;
  }

  const progress = elapsed / DURATION;
  renderFrame(progress);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

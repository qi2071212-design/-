<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Oscilloscope Animation</title>
<style>
  body {
    background: white;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ======== waveform をすべて 50 にした配列 =========
const waveform = [
  50,50,50,50,50,50,50,50,50,50,
  50,50,50,50,50,50,50,50,50,50,
  50
];

// ======== 基本設定 =========
const DURATION = 160 * 1000; // 160秒
const totalPoints = waveform.length;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let startTime = null;
let lastTimestamp = null;
let finished = false;

// ★の軌跡（紙が流れているように左へ流す）
let trail = [];

// Y座標変換（50固定なので中央に固定される）
function getY(value) {
  const centerY = canvas.height / 2;
  const scale = canvas.height * 0.01;
  return centerY - (value - 50) * scale;
}

function renderFrame(progress, dt) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const maxIndex = totalPoints - 1;

  // ★の滑らかなインデックス
  let floatIndex = progress * maxIndex;
  floatIndex = Math.max(0, Math.min(floatIndex, maxIndex));

  const i0 = Math.floor(floatIndex);
  const i1 = Math.min(i0 + 1, maxIndex);
  const frac = floatIndex - i0;

  // 補間して滑らかに（全部50なので常に50）
  const v0 = waveform[i0];
  const v1 = waveform[i1];
  const vInterp = v0 * (1 - frac) + v1 * frac;

  // ●の位置（中央固定）
  const starX = canvas.width / 2;
  const starY = getY(vInterp);

  // ======== 軌跡を左へ流す ========
  const scrollSpeed = canvas.width / 12;
  const dx = scrollSpeed * (dt / 1000);

  for (let p of trail) p.x -= dx;
  trail = trail.filter(p => p.x > -50);

  trail.push({ x: starX, y: starY });

  // ======== 軌跡を折れ線グラフとして描画 ========
  if (trail.length > 1) {
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);
    for (let i = 1; i < trail.length; i++) {
      ctx.lineTo(trail[i].x, trail[i].y);
    }
    ctx.stroke();
  }

  // ======== ●の描画（赤い丸） ========
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(starX, starY, 12, 0, Math.PI * 2);
  ctx.fill();
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  if (!lastTimestamp) lastTimestamp = timestamp;

  const elapsed = timestamp - startTime;
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  if (elapsed >= DURATION) {
    if (!finished) {
      finished = true;
      renderFrame(1, dt);
    }
    return;
  }

  const progress = elapsed / DURATION;
  renderFrame(progress, dt);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Oscilloscope Animation</title>
<style>
  body {
    background: white;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ======== Excel 波形データ =========
const waveform = [
50,59,50,43,65,40,51,56,58,50,43,40,61,62,52,52,54,60,40,46,
58,58,50,59,56,43,43,52,56,35,42,37,56,36,43,38,57,35,42,38,
57,35,42,37,57,56,50,45,52,46,50,46,65,40,68,41,70,43,68,41,
69,40,70,40,70,40,71,39,56,46,60,45,63,43,99,3,3,3,3,3,3,3,
3,3,3,3,5,7,8,60,43,70,40,73,39,75,32,78,34,75,32,78,30,80,
32,80,32,80,30,80,30
];

// ======== 基本設定 =========
const duration = 92 * 1000; // 92秒
const totalPoints = waveform.length;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// 1点あたりの時間
const interval = duration / totalPoints;

// ★ の位置
let index = 0;
let lastTime = performance.now();

// ★の軌跡（左へ流れる）
let trail = [];

function animate(t) {
  requestAnimationFrame(animate);

  // 時間経過で次の点へ
  if (t - lastTime >= interval) {
    lastTime = t;
    index++;
    if (index >= totalPoints) index = 0;

    // ★のY座標を trail に追加
    const y = valueToY(waveform[index]);
    trail.push(y);

    // trail の長さを画面幅に合わせる
    if (trail.length > canvas.width) trail.shift();
  }

  draw();
}

// 値 → Y座標変換
function valueToY(v) {
  // Excel値は 0〜100 程度 → キャンバス中央 ± 振幅
  const center = canvas.height / 2;
  const scale = canvas.height * 0.004; // 振幅調整
  return center - (v - 50) * scale;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ======== 波形ライン（黒）========
  ctx.strokeStyle = "black";
  ctx.lineWidth = 3;
  ctx.beginPath();

  for (let i = 0; i < trail.length; i++) {
    const x = canvas.width - trail.length + i;
    const y = trail[i];
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // ======== ★（黒）========
  const starX = canvas.width / 2;
  const starY = valueToY(waveform[index]);

  ctx.fillStyle = "black";
  ctx.font = "40px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("★", starX, starY);

  // ======== 目盛り（非表示）========
  // 100等分の計算だけ行う（描画しない）
  const step = canvas.width / 100;
  // for (let i = 0; i <= 100; i++) {
  //   const x = i * step;
  //   ctx.strokeStyle = "rgba(0,0,0,0)";
  //   ctx.beginPath();
  //   ctx.moveTo(x, 0);
  //   ctx.lineTo(x, canvas.height);
  //   ctx.stroke();
  // }
}

animate();
</script>
</body>
</html>

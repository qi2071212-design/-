<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Oscilloscope Animation</title>
<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ======== あなたの Excel 波形データ =========
const waveform = [
50,59,50,43,65,40,51,56,58,50,43,40,61,62,52,52,54,60,40,46,
58,58,50,59,56,43,43,52,56,35,42,37,56,36,43,38,57,35,42,38,
57,35,42,37,57,56,50,45,52,46,50,46,65,40,68,41,70,43,68,41,
69,40,70,40,70,40,71,39,56,46,60,45,63,43,99,3,3,3,3,3,3,3,
3,3,3,3,5,7,8,60,43,70,40,73,39,75,32,78,34,75,32,78,30,80,
32,80,32,80,30,80,30
];

// ======== 基本設定 =========
const duration = 92 * 1000; // 92秒
const totalPoints = waveform.length;
const interval = duration / totalPoints; // 1点あたりの時間

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ★ の位置
let index = 0;
let lastTime = performance.now();

// 波形の描画用バッファ
let trail = [];

function animate(t) {
  requestAnimationFrame(animate);

  // 時間経過で次の点へ
  if (t - lastTime >= interval) {
    lastTime = t;
    index++;
    if (index >= totalPoints) index = 0;

    // 新しい点を trail に追加
    trail.push(waveform[index]);
    if (trail.length > canvas.width) trail.shift();
  }

  // 描画
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 波形ライン
  ctx.strokeStyle = "cyan";
  ctx.lineWidth = 2;
  ctx.beginPath();

  for (let i = 0; i < trail.length; i++) {
    const x = canvas.width - trail.length + i;
    const y = canvas.height / 2 - (trail[i] - 50) * 3; 
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // ★ の描画
  const starY = canvas.height / 2 - (waveform[index] - 50) * 3;
  ctx.fillStyle = "yellow";
  ctx.font = "30px sans-serif";
  ctx.fillText("★", canvas.width / 2, starY);
}

animate();
</script>
</body>
</html>

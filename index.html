<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscilloscope Preview</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =======================
// 設定
// =======================

const TOTAL_DURATION = 120; // 2分
const BPM = 125;
const BPM_FREQ = BPM / 60;

let startTime = 0;
let started = false;

// =======================
// Enterで開始
// =======================
window.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !started){
        started = true;
        startTime = performance.now();
        draw();
    }
});

// =======================
// 波形生成
// =======================
function generateValue(t){
    const h = canvas.height;
    const bigRange = h * 0.35;

    const main = Math.sin(2 * Math.PI * BPM_FREQ * t) * bigRange * 0.7;

    const detail =
        Math.sin(2 * Math.PI * BPM_FREQ * 2.3 * t) * bigRange * 0.25 +
        Math.sin(2 * Math.PI * BPM_FREQ * 3.7 * t) * bigRange * 0.15;

    const slow = Math.sin(t * 0.05) * h * 0.05;

    return main + detail + slow;
}

// =======================
// 描画ループ
// =======================
function draw(){
    const now = performance.now();
    const elapsed = (now - startTime) / 1000;
    const elapsedClamped = Math.min(elapsed, TOTAL_DURATION);

    render(elapsedClamped);

    if(elapsedClamped >= TOTAL_DURATION){
        return;
    }

    requestAnimationFrame(draw);
}

// =======================
// 描画
// =======================
function render(elapsed){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerY = canvas.height / 2;
    const steps = 1000;

    // 全体グラフ（薄い）
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#aaa";
    ctx.beginPath();
    for(let i = 0; i <= steps; i++){
        const p = i / steps;
        const t = p * TOTAL_DURATION;
        const x = p * canvas.width;
        const y = centerY - generateValue(t);

        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // ★の軌跡（黒）
    const progress = elapsed / TOTAL_DURATION;
    const trailSteps = Math.floor(steps * progress);

    ctx.strokeStyle = "#000";
    ctx.beginPath();
    for(let i = 0; i <= trailSteps; i++){
        const p = i / steps;
        const t = p * TOTAL_DURATION;
        const x = p * canvas.width;
        const y = centerY - generateValue(t);

        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // ★（現在位置）
    if(started){
        const starX = (elapsed / TOTAL_DURATION) * canvas.width;
        const starY = centerY - generateValue(elapsed);

        ctx.fillStyle = "#000";
        ctx.font = "40px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("★", starX, starY);
    }

    // 中央線
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, centerY);
    ctx.lineTo(canvas.width, centerY);
    ctx.stroke();

    // タイマー
    if(started){
        const min = Math.floor(elapsed / 60).toString().padStart(2, "0");
        const sec = Math.floor(elapsed % 60).toString().padStart(2, "0");

        ctx.fillStyle = "#000";
        ctx.font = "28px Arial";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.fillText(`${min}:${sec}`, canvas.width - 20, 20);
    }

    // 開始待機
    if(!started){
        ctx.fillStyle = "#000";
        ctx.font = "48px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Press Enter", canvas.width / 2, canvas.height / 2);
    }
}

// 初期描画
render(0);
</script>

</body>
</html>
